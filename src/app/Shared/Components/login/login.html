<div class="login-container">
  <h2>Вхід в систему</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="admin@gmail.com"
        [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
      >
    </div>

    <div class="form-group">
      <label for="password">Пароль</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder="admin"
        [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
      >
    </div>

    <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-submit">
      @if (isLoading) { Зачекайте... } @else { Увійти }
    </button>

    <div class="register-link" style="text-align: center; margin-top: 20px;">
      Немає акаунту? <a routerLink="/register" style="color: #3498db; font-weight: 600; text-decoration: none;">Зареєструватися</a>
    </div>

  </form>
</div>
