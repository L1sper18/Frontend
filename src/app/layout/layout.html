<header>
  <a routerLink="/" style="text-decoration: none; color: white;">
    <h1>{{ title }}</h1>
  </a>

  <div class="auth-controls">
    @if (authService.isAuthenticated()) {
      <div class="user-info">
        <span class="user-name">👤 {{ authService.currentUser()?.fullName }}</span>
        <button (click)="logout()" class="nav-btn logout-btn">Вийти</button>
      </div>
    } @else {
      <a routerLink="/login" class="nav-btn login-btn">Вхід</a>
      <a routerLink="/register" class="nav-btn register-btn">Реєстрація</a>
    }
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer>
  <p>© 2025 {{ Dodatok }}</p>
</footer>
